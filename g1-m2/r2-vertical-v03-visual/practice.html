<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>T12 操作练习 · EW-UX 图谱</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
  <script type="module" src="./practice.mjs"></script>
</head>
<body>
  <main class="page">
    <header class="heading">
      <div class="identity"><span class="mark" aria-hidden="true"></span> EW-UX 图谱 <span class="identity-divider"></span> <a class="nav-link" href="./">返回 T12 回放</a></div>
      <h1>T12 操作练习</h1>
      <p>亲手添加、移除或改色，观察承托、庭院和抽象通行如何变化。</p>
    </header>
    <div id="guide-tabs" class="guide-tabs" aria-label="选择练习"></div>
    <div class="workspace practice">
      <div>
        <section class="view" aria-label="练习中的可旋转三维场景">
          <div class="view-head">
            <span class="view-label"><span></span> 已提交世界</span>
            <button type="button" id="reset-view" class="quiet" disabled>重置视角</button>
          </div>
          <div id="scene"></div>
          <p id="view-message" class="view-message" role="status">正在读取 T12 检查点…</p>
          <div class="view-foot"><span>拖动旋转 · 滚轮缩放 · 右键拖动平移</span><span id="cursor-readout">指向网格查看位置</span></div>
        </section>
        <fieldset class="edit-tools" id="edit-tools" disabled>
          <legend class="sr-only">三维建造设置</legend>
          <div class="edit-pickers">
            <label>楼层<select id="edit-level"></select></label>
          </div>
          <div class="palette" id="palette" role="group" aria-label="颜色">
            <button type="button" class="quiet" data-color="PAPER" aria-pressed="true"><span class="paint paper"></span>宣纸</button>
            <button type="button" class="quiet" data-color="MIST" aria-pressed="false"><span class="paint mist"></span>雾色</button>
            <button type="button" class="quiet" data-color="SILK" aria-pressed="false"><span class="paint silk"></span>丝色</button>
            <button type="button" class="quiet" data-color="MOUNTAIN" aria-pressed="false"><span class="paint mountain"></span>山色</button>
          </div>
          <p class="edit-hint">左键添加普通单元 · 右键移除 · Shift＋左键改色</p>
        </fieldset>
        <dl class="facts practice-facts">
          <div class="fact"><dt><span class="swatch court"></span>庭院</dt><dd id="court-fact">—</dd></div>
          <div class="fact"><dt><span class="swatch support"></span>当前承托</dt><dd id="support-fact">—</dd></div>
          <div class="fact"><dt><span class="swatch passage"></span>抽象通行</dt><dd id="stair-fact">—</dd></div>
        </dl>
      </div>
      <aside class="details practice-panel" aria-label="练习操作">
        <div class="step-line"><span id="practice-source">检查点</span><button class="quiet" id="reset-guide" type="button" disabled>重新开始</button></div>
        <h2 id="guide-title">操作练习</h2>
        <p id="guide-summary" class="muted"></p>
        <div class="task" aria-live="polite">
          <span id="task-index"></span>
          <strong id="task-title"></strong>
          <p id="task-details"></p>
          <div class="task-location"><p id="task-target"></p><button type="button" id="locate-target" class="quiet" hidden>切到目标层</button></div>
        </div>
        <div id="choices" class="choices" hidden></div>
        <div id="proposals" class="choices" hidden></div>
        <p id="feedback" class="feedback" role="status"></p>
        <p class="legend">橙色虚线是待确认候选，蓝绿色虚线是已批准的抽象通行。实体楼板仍保持闭合，练习结果保存在当前页面会话中。</p>
      </aside>
    </div>
    <footer><span>R2-V3-VIS-01 · M1</span></footer>
  </main>
</body>
</html>
